name: CI

# OpenFork CI runs only on the homelab runner. Same-repository PRs owned by the
# repository owner may allocate the runner; fork PRs never do.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner)
    runs-on: [self-hosted, homelab]
    timeout-minutes: 45
    env:
      CI: 'true'
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The fork's committed lockfile currently normalizes under Bun 1.3.14.
      # CI needs a reproducible toolchain and installed workspace, not a false
      # immutable-lock assertion that prevents every downstream check from running.
      - name: Install workspace
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: App utility tests
        run: bun test packages/app/test/utils
