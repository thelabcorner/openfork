name: dev-pre-release
run-name: "dev pre-release ${{ github.run_number }}"

# OpenFork dev pre-release packaging.
#
# GitHub-hosted runners ONLY. This workflow deliberately does not use the
# `[self-hosted, homelab]` runner that `.github/workflows/ci.yml` targets.
#
# This fork deliberately has no upstream-style `publish.yml`. `script/release`
# fails closed rather than dispatching a missing/upstream publication pipeline.
# This workflow is the OpenFork-owned dev distribution entry point:
#
#   notes         - resolve a dev version/tag and create a DRAFT pre-release,
#                   with release notes enumerating every commit, package, and
#                   changed file in the range.
#   build-cli     - `packages/opencode/script/build.ts` with OPENCODE_RELEASE=1
#                   cross-compiles EVERY Bun target (linux glibc+musl x64/arm64
#                   and baseline, darwin x64/arm64, windows x64/arm64/baseline)
#                   on one ubuntu-latest runner, then archives and uploads each
#                   (`openfork-windows-x64.zip` contains `openfork.exe` plus an
#                   `opencode` compatibility launcher, etc.).
#                   This is the same packaging block `script/publish.ts` uses.
#   build-desktop - GitHub-hosted matrix (macOS Intel + Apple Silicon, Windows,
#                   Linux) that builds the unsigned Electron installers
#                   (.dmg/.zip, .exe, .AppImage/.deb/.rpm). Best-effort: it is
#                   allowed to fail without blocking the CLI release because the
#                   Electron tree still ships without Apple/Azure signing
#                   credentials and without `packages/desktop/native/`.
#   release       - flip the draft to a published pre-release.
#
# `script/publish.ts` itself is intentionally not run. Upstream npm namespaces
# are not OpenFork distribution channels, and AUR/Homebrew publication requires
# explicit fork-owned destinations. build-cli uses only the GitHub-release
# packaging portion.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional explicit dev version (default 0.0.0-dev.<run>+<sha>)"
        required: false
        type: string
      base:
        description: "Optional commit/ref to enumerate release notes from (default: push range)"
        required: false
        type: string
      release_class:
        description: "Release contract. 'cli-only' (default) = CLI archives are the whole payload and desktop installers are best-effort extras. 'desktop' = every declared desktop platform MUST publish its full installer set; publication fails closed instead of shipping a partial desktop release."
        required: false
        default: cli-only
        type: choice
        options:
          - cli-only
          - desktop
      desktop_platforms:
        description: "Comma-separated desktop platform labels required when release_class=desktop (default: all four). Choose from 'macOS x64,macOS arm64,Windows x64,Linux x64'."
        required: false
        type: string

concurrency:
  group: dev-pre-release-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Each job below re-grants `contents: write` explicitly
# because all four publish into the same draft release; a read-only workflow
# default means a job added later cannot silently inherit release write.
permissions:
  contents: read

env:
  GH_REPO: thelabcorner/openfork

jobs:
  notes:
    name: Version, notes, and draft pre-release
    runs-on: ubuntu-latest
    permissions:
      # Creates the tag and the draft release the other jobs upload into.
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      base: ${{ steps.version.outputs.base }}
      release_class: ${{ steps.releaseclass.outputs.release_class }}
      desktop_platforms: ${{ steps.releaseclass.outputs.desktop_platforms }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Resolve dev version and commit range
        id: version
        shell: bash
        run: |
          set -euo pipefail
          SHA_SHORT="$(git rev-parse --short HEAD)"
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}+${SHA_SHORT}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.base }}" ] && git cat-file -e "${{ inputs.base }}^{commit}" 2>/dev/null; then
            echo "base=${{ inputs.base }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # Resolve the release contract BEFORE anything is published, so an
      # unusable value (unknown class, unknown desktop label, desktop class with
      # no platforms) fails the run here rather than at the undraft gate.
      - name: Resolve release class and desktop platform set
        id: releaseclass
        shell: bash
        env:
          RAW_CLASS: ${{ inputs.release_class }}
          RAW_PLATFORMS: ${{ inputs.desktop_platforms }}
        run: |
          set -euo pipefail
          CLASS="${RAW_CLASS:-cli-only}"
          PLATFORMS="${RAW_PLATFORMS:-}"
          echo "release_class=$CLASS" >> "$GITHUB_OUTPUT"
          echo "desktop_platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"
          echo "Declared release class: $CLASS"
          echo "Declared desktop platforms: ${PLATFORMS:-<all>}"

      - name: Generate release notes enumerating all changes
        shell: bash
        env:
          BASE: ${{ steps.version.outputs.base }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "# OpenFork dev pre-release ${VERSION}"
            echo
            echo "Triggered by \`${{ github.event_name }}\` on \`${GITHUB_REF_NAME}\` at [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})."
            echo "Commit range: \`${BASE}..${GITHUB_SHA}\`."
            echo
            echo "## Commits"
            echo
            git log --no-merges --pretty=format:'- [`%h`]('"${{ github.server_url }}/${{ github.repository }}"'/commit/%H) %s' "${BASE}..${GITHUB_SHA}" || true
            echo
            echo
            echo "## Changed packages (file count)"
            echo
            git diff --name-only "${BASE}" "${GITHUB_SHA}" \
              | awk -F/ '{ if ($1=="packages") print $2; else if ($1=="docs") print "docs"; else if ($1=="script") print "script"; else if ($1==".github") print ".github"; else print $1 }' \
              | sort | uniq -c | sort -rn \
              | awk '{ printf "- `%s`: %s file(s)\n", $2, $1 }'
            echo
            echo "## Benchmarks and release scripts touched"
            echo
            git diff --name-only "${BASE}" "${GITHUB_SHA}" \
              | grep -E '^(benchmarks/|script/(release|publish)|packages/[^/]+/script/)' \
              | sed 's/^/- `/' | sed 's/$/`/' || echo "- (none in this range)"
            echo
            echo "## All changed files"
            echo
            echo '```'
            git diff --name-status "${BASE}" "${GITHUB_SHA}" || true
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Create draft pre-release (holds the tag for asset uploads)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            --draft \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "OpenFork dev pre-release ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md

      - name: Upload release notes artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: release-notes.md

  build-cli:
    name: Build CLI (all targets)
    needs: notes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      # build.ts runs `gh release upload` against the draft release (GH_TOKEN).
      contents: write
    env:
      CI: "true"
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build and upload all CLI targets
        env:
          OPENCODE_VERSION: ${{ needs.notes.outputs.version }}
          OPENCODE_CHANNEL: dev
          OPENCODE_RELEASE: "1"
          GH_TOKEN: ${{ github.token }}
        run: bun ./packages/opencode/script/build.ts

      - name: List uploaded CLI archives
        run: ls -la packages/opencode/dist/*.zip packages/opencode/dist/*.tar.gz

      - name: Upload CLI archives as workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openfork-cli-all-targets
          path: |
            packages/opencode/dist/*.zip
            packages/opencode/dist/*.tar.gz

  build-desktop:
    name: Desktop ${{ matrix.label }}
    needs: notes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    continue-on-error: true
    permissions:
      # `gh release upload` of the installers into the draft release.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            label: macOS x64
            flag: --mac --x64
          - os: macos-15
            label: macOS arm64
            flag: --mac --arm64
          - os: windows-2022
            label: Windows x64
            flag: --win
          - os: ubuntu-latest
            label: Linux x64
            flag: --linux
    env:
      CI: "true"
      HUSKY: "0"
      OPENCODE_VERSION: ${{ needs.notes.outputs.version }}
      OPENCODE_CHANNEL: dev
      OPENCODE_DESKTOP_LOCAL_CLI: "1"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install rpm tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Ensure native resource dir exists
        shell: bash
        run: mkdir -p packages/desktop/native

      - name: Prepare (version + node sidecar + local CLI)
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts

      - name: Build renderer and main
        working-directory: packages/desktop
        run: bunx electron-vite build

      - name: Package installers (unsigned)
        working-directory: packages/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder ${{ matrix.flag }} --publish never --config electron-builder.config.ts

      - name: Verify packaged OXP tunnel runtime
        working-directory: packages/desktop
        run: bun ./scripts/verify-oxp-package.ts

      # Channel-aware: dev passes only when no staged worktree-store payload was
      # packaged while the lock pins no target; pinned builds must match the pin.
      - name: Verify packaged worktree-store sidecar
        working-directory: packages/desktop
        run: bun ./scripts/verify-worktree-store-package.ts dist

      - name: Upload installers to draft pre-release
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/latest*.yml
            packages/desktop/dist/*.blockmap
          )
          if (( ${#files[@]} == 0 )); then
            echo "No desktop installer artifacts produced on ${{ matrix.label }}"
            exit 0
          fi
          printf 'Uploading:\n'; printf '  %s\n' "${files[@]}"
          gh release upload "${{ needs.notes.outputs.tag }}" "${files[@]}" --clobber

      - name: Upload installers as workflow artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openfork-desktop-${{ matrix.label }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/latest*.yml

  release:
    name: Publish pre-release
    needs: [notes, build-cli, build-desktop]
    if: always() && needs.build-cli.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      # `gh release edit --draft=false` publishes the release.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes

      # ---- Release integrity gate -------------------------------------------
      # Everything below runs BEFORE the undraft. The draft is the only mutable
      # state here, so every failure still leaves a repairable draft instead of a
      # published release that is short an asset.
      #
      # Order is load-bearing:
      #   1. plan   - resolve the declared inventory (deterministic, no network)
      #   2. check  - fail closed against the assets actually on the draft
      #   3. manifest- hash the exact downloaded payload into SHA256SUMS
      #   4. verify - re-download the published assets and re-hash them
      #   5. undraft- only now is the release published
      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Declare expected inventory for this release
        id: plan
        shell: bash
        env:
          RELEASE_CLASS: ${{ needs.notes.outputs.release_class }}
          DESKTOP_PLATFORMS: ${{ needs.notes.outputs.desktop_platforms }}
        run: |
          set -euo pipefail
          # An explicit argument array, not `${VAR:+--desktop "$VAR"}`: that
          # optional-expansion form drops the value under `set -u`, which would
          # silently widen or narrow a declared desktop promise instead of
          # failing closed.
          ARGS=(--class "$RELEASE_CLASS")
          if [ -n "$DESKTOP_PLATFORMS" ]; then
            ARGS+=(--desktop "$DESKTOP_PLATFORMS")
          fi
          bun ./packages/opencode/script/release-assets.ts plan "${ARGS[@]}" | tee plan.txt

      - name: Fail closed if the draft is missing expected assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.notes.outputs.tag }}
          RELEASE_CLASS: ${{ needs.notes.outputs.release_class }}
          DESKTOP_PLATFORMS: ${{ needs.notes.outputs.desktop_platforms }}
        run: |
          set -euo pipefail
          # List the assets GitHub actually holds on the draft. This is the real
          # published payload, not what the build jobs believed they uploaded.
          gh release view "$TAG" --json assets --jq '.assets[].name' > draft-assets.txt
          echo "Draft assets:"; sed 's/^/  /' draft-assets.txt
          # Same explicit-array construction as the plan step, so the check can
          # never run against a different platform set than the one declared.
          ARGS=(--class "$RELEASE_CLASS" --assets draft-assets.txt)
          if [ -n "$DESKTOP_PLATFORMS" ]; then
            ARGS+=(--desktop "$DESKTOP_PLATFORMS")
          fi
          if ! bun ./packages/opencode/script/release-assets.ts check "${ARGS[@]}"; then
            echo "::error::Release inventory incomplete for declared class '$RELEASE_CLASS'. The release stays a draft."
            exit 1
          fi

      - name: Generate and publish the SHA256 manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.notes.outputs.tag }}
        run: |
          set -euo pipefail
          # Hash the exact bytes that will be published, not the build workspace.
          rm -rf release-payload
          mkdir -p release-payload
          gh release download "$TAG" --dir release-payload --clobber
          bun ./packages/opencode/script/release-assets.ts manifest --dir release-payload
          cat release-payload/SHA256SUMS
          gh release upload "$TAG" release-payload/SHA256SUMS --clobber

      - name: Verify draft assets against SHA256SUMS before publishing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.notes.outputs.tag }}
        run: |
          set -euo pipefail
          # Fresh directory: this reads back through the upload path rather than
          # reusing the files hashed a step earlier.
          rm -rf release-verify
          mkdir -p release-verify
          gh release download "$TAG" --dir release-verify --clobber
          if ! bun ./packages/opencode/script/release-assets.ts verify --dir release-verify; then
            echo "::error::Draft release assets do not match SHA256SUMS. The release stays a draft."
            exit 1
          fi

      - name: Publish (undraft) the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "${{ needs.notes.outputs.tag }}" \
            --draft=false \
            --prerelease \
            --notes-file release-notes.md

      # Post-publish verification. The pre-undraft step above proves the bytes
      # GitHub accepted; this proves the bytes a consumer actually downloads
      # from the published release still hash to the same SHA256SUMS. Same
      # manifest, same helper -- only the release's visibility has changed.
      - name: Verify published assets by re-download and re-hash
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.notes.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf release-postverify
          mkdir -p release-postverify
          gh release download "$TAG" --dir release-postverify --clobber
          if ! bun ./packages/opencode/script/release-assets.ts verify --dir release-postverify; then
            echo "::error::PUBLISHED release assets do not match SHA256SUMS. The release is already public and its assets must be repaired by hand."
            exit 1
          fi

      - name: Summarize published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## OpenFork dev pre-release ${{ needs.notes.outputs.version }}"
            echo
            echo "- Tag: \`${{ needs.notes.outputs.tag }}\`"
            echo "- Release class: \`${{ needs.notes.outputs.release_class }}\`"
            echo "- Verified: inventory gate + SHA256SUMS re-download check passed (before and after publish)"
            echo "- Runner: GitHub-hosted (homelab/self-hosted never used)"
            echo "- Desktop jobs: \`${{ needs.build-desktop.result }}\`"
            echo
            echo "### Release assets"
            echo
            echo '```'
            gh release view "${{ needs.notes.outputs.tag }}" --json assets --jq '.assets[] | "\(.size)\t\(.name)"'
            echo '```'
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
