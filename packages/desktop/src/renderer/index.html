<!doctype html>
<html lang="en" style="background-color: var(--background-base)">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenCode</title>
    <link rel="icon" type="image/png" href="./favicon-96x96-v3.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon-v3.svg" />
    <link rel="shortcut icon" href="./favicon-v3.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-v3.png" />
    <meta name="theme-color" content="#F8F7F7" />
    <meta property="og:image" content="./social-share.png" />
    <meta property="twitter:image" content="./social-share.png" />
    <script id="oc-theme-preload-script" src="./oc-theme-preload.js"></script>
    <style id="oc-bootstrap-style">
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      #oc-bootstrap-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafafa;
      }

      html[data-color-scheme="dark"] #oc-bootstrap-splash {
        background: #080808;
      }

      #oc-bootstrap-splash svg {
        width: 48px;
        height: 60px;
        color: #1b1b1b;
        opacity: 0.52;
        animation: oc-bootstrap-pulse 1.2s ease-in-out infinite alternate;
      }

      html[data-color-scheme="dark"] #oc-bootstrap-splash svg {
        color: #e8e8e8;
      }

      @keyframes oc-bootstrap-pulse {
        from {
          opacity: 0.36;
        }
        to {
          opacity: 0.68;
        }
      }
    </style>
  </head>
  <body class="antialiased overscroll-none text-12-regular overflow-hidden">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="oc-bootstrap-splash" aria-hidden="true">
      <svg viewBox="0 0 80 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M60 80H20V40H60V80Z" fill="currentColor" opacity="0.45" />
        <path d="M60 20H20V80H60V20ZM80 100H0V0H80V100Z" fill="currentColor" />
      </svg>
    </div>
    <div id="root" class="flex flex-col h-dvh"></div>
    <script src="./index.tsx" type="module"></script>
  </body>
</html>
