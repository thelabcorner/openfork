<!doctype html>
<!--
  DEV-ONLY review surface for the ChatGPT/OXP activity transcript.

  Deliberately NOT registered in vite.config.ts `build.rollupOptions.input`, so it
  is served by the dev server and can never end up in a production bundle.

  Served by this package's own Vite dev server at /lab-oxp-activity.html. It makes
  no API calls and holds no server connection — it exists so the transcript's
  composition, density and states can be reviewed without the desktop app.
-->
<html lang="en" style="background-color: var(--v2-background-bg-deep, #fafafa)">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OXP activity transcript lab · OpenFork</title>
    <script id="oc-theme-preload-script" src="/oc-theme-preload.js"></script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body class="antialiased overscroll-none overflow-hidden bg-v2-background-bg-deep">
    <noscript>You need to enable JavaScript to run this page.</noscript>
    <div id="root"></div>
    <script src="/src/lab/oxp-activity/mount.tsx" type="module"></script>
  </body>
</html>
